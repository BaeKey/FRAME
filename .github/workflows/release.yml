name: Publish FRAME image

on:
  release:
    # GitHub Release 发布后构建并推送镜像。
    types: [published]
  # 手动运行，并指定镜像标签。
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: manual
        type: string

permissions:
  contents: read

# 防止同一标签的多个镜像发布任务并行执行。
concurrency:
  group: image-${{ github.event.release.tag_name || inputs.image_tag || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push multi-platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Release 时检出发布标签；手动运行时检出当前提交。
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Set image name and source revision
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          # Release 版本生成对应标签；仅正式版 Release 会更新 latest。
          tags: |
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.image_tag }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.image_tag }}
            REVISION=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.image_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '## FRAME image\n\n`%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
